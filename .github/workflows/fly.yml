# Despliegue en Fly.io en cada push a la rama del ERP. Necesita el secreto
# FLY_API_TOKEN en GitHub (Settings → Secrets and variables → Actions); sin él,
# el trabajo se salta en lugar de fallar.
name: Desplegar en Fly.io

on:
  push:
    branches: [productos-base, main]
  workflow_dispatch:

concurrency:
  group: fly-despliegue
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.FLY_API_TOKEN != ''
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - name: Desplegar
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only
      - name: Sin token
        if: env.FLY_API_TOKEN == ''
        run: echo "No hay secreto FLY_API_TOKEN; no se despliega en Fly.io."
